<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111a22">
<title>Sign in – Cretan Eagle Flight Bag</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<style>
@font-face{font-family:"IBM Plex Sans";font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans Condensed";font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-condensed-latin-600-normal.woff2) format("woff2")}
:root{--bg:#111a22;--panel:#18232d;--sunk:#0d151c;--line:#3a4c5d;--fg:#e9eef2;--muted:#98a8b6;--brand:#b8333a;--brand-hi:#e0666b;--focus:#f0b84d;--bad:#ec6464;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 "IBM Plex Sans",system-ui,Arial,sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
form{width:100%;max-width:400px;background:var(--panel);border:1px solid #2b3a48;border-top:3px solid var(--brand);border-radius:6px;padding:28px 26px;display:flex;flex-direction:column;gap:16px}
.mark{width:58px;height:57px;background:var(--brand-hi);-webkit-mask:url(afm/cea-eagle.png) center/contain no-repeat;mask:url(afm/cea-eagle.png) center/contain no-repeat}
h1{font:600 28px/1.1 "IBM Plex Sans Condensed","IBM Plex Sans",Arial,sans-serif;margin:0}
p{margin:0;color:var(--muted);font-size:14.5px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
input{font:400 17px "IBM Plex Sans",system-ui,sans-serif;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);color:var(--fg);min-height:48px}
input:focus{outline:2px solid var(--focus);outline-offset:1px}
button{font:600 16px "IBM Plex Sans",system-ui,sans-serif;min-height:50px;border-radius:6px;border:0;background:var(--brand);color:#fff;cursor:pointer}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button:disabled{opacity:.6}
.err{color:var(--bad);font-weight:600;min-height:20px}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <div class="mark" role="img" aria-label="Cretan Eagle Aviation"></div>
  <h1>DA40 D Flight Bag</h1>
  <p>Cretan Eagle Aviation Flight Academy. Sign in with the e-mail and access code the school gave you.</p>
  <label>E-mail<input id="email" type="email" autocomplete="username" required></label>
  <label>Access code<input id="code" type="password" autocomplete="current-password" required></label>
  <div class="err" id="err" role="alert"></div>
  <button type="submit" id="go">Sign in</button>
</form>
<script>
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('go'),er=document.getElementById('err');b.disabled=true;er.textContent='';
  try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,code:document.getElementById('code').value})});
    const j=await r.json().catch(()=>({}));if(r.ok){location.href='/'}else er.textContent=j.error||'Sign-in failed.'}
  catch(x){er.textContent='No connection to the school server.'}b.disabled=false});
</script>
</body>
</html>
